<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">myxszjb/seeWxapkg Star growth</title>
  <desc id="chart-description">myxszjb/seeWxapkg has no recorded stars yet.</desc>
  <defs>
    <linearGradient id="background-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1713" />
      <stop offset="1" stop-color="#06110e" />
    </linearGradient>
    <linearGradient id="area-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.30" />
      <stop offset="1" stop-color="#0a1713" stop-opacity="0.02" />
    </linearGradient>
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #34d399; font-size: 12px; font-weight: 700; letter-spacing: 2.2px; }
      .heading { fill: #ecfdf5; font-size: 24px; font-weight: 720; }
      .stat { fill: #ecfdf5; font-size: 27px; font-weight: 760; }
      .stat-label { fill: #91aaa1; font-size: 12px; font-weight: 600; }
      .axis-label { fill: #829c93; font-size: 11px; font-weight: 520; }
      .footer-label { fill: #91aaa1; font-size: 11px; }
      .empty-label { fill: #91aaa1; font-size: 13px; font-weight: 600; }
      .grid-line { stroke: #17352d; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .vertical-grid { stroke-dasharray: 3 7; }
      .trend-line { fill: none; stroke: #6ee7b7; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .trend-glow { fill: none; stroke: #10b981; stroke-opacity: 0.28; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .point-marker { fill: #0a1713; stroke: #6ee7b7; stroke-width: 3; vector-effect: non-scaling-stroke; }
      .point-halo { fill: #6ee7b7; fill-opacity: 0.13; }
    </style>
  </defs>

  <rect width="900" height="480" rx="22" fill="url(#background-gradient)" />
  <rect x="0.5" y="0.5" width="899" height="479" rx="21.5" fill="none" stroke="#1b3a31" />

  <g aria-hidden="true">
    <rect x="48" y="36" width="132" height="28" rx="14" fill="#0d251e" stroke="#1d5b47" />
    <circle cx="65" cy="50" r="4" fill="#34d399" />
    <text x="77" y="54" class="eyebrow">STAR GROWTH</text>
    <text x="48" y="99" class="heading">myxszjb/seeWxapkg</text>

    <text x="852" y="65" text-anchor="end" class="stat">0</text>
    <text x="852" y="84" text-anchor="end" class="stat-label">TOTAL STARS</text>
    <text x="852" y="104" text-anchor="end" class="stat-label">Waiting for the first star · 0 MONTHS</text>
  </g>

  <g aria-hidden="true">
    <line x1="78" y1="398.00" x2="838" y2="398.00" class="grid-line" />
    <text x="62" y="402.00" text-anchor="end" class="axis-label">0</text>
    <line x1="78" y1="138.00" x2="838" y2="138.00" class="grid-line" />
    <text x="62" y="142.00" text-anchor="end" class="axis-label">1</text>

    <g class="empty-state">
      <circle cx="450" cy="268" r="38" fill="#0d251e" stroke="#1d5b47" />
      <path d="M450 243l7.4 15 16.6 2.4-12 11.7 2.8 16.5-14.8-7.8-14.8 7.8 2.8-16.5-12-11.7 16.6-2.4z" fill="#34d399" />
      <text x="450" y="331" text-anchor="middle" class="empty-label">Waiting for the first star</text>
    </g>
  </g>

  <g aria-hidden="true">
    <circle cx="50" cy="446" r="4" fill="#34d399" />
    <text x="62" y="450" class="footer-label">Cumulative stars by UTC date</text>
    <text x="850" y="450" text-anchor="end" class="footer-label">No Stargazers API records yet</text>
  </g>
</svg>
